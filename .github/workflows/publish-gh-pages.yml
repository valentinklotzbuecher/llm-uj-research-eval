name: Publish to GitHub Pages

on:
  push:
    branches: [working-paper]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          install-r: true
          r-version: 'release'

      - name: Install minimal R packages for knitr
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown", "jsonlite"), repos = "https://cloud.r-project.org")'

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Create required directories for R setup
        run: mkdir -p papers data results

      - name: Render (using frozen computations)
        run: quarto render --no-execute

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
