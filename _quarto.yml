project:
  type: book
  output-dir: _book
  resources:
    - tools/issue_annotation_ui/**

python:
  executable: .venv/bin/python

book:
  title: "Comparing LLM and human reviews of social science research using data from Unjournal.org"
  author:
    - name: "Valentin Klotzbücher"
      orcid: 0000-0001-9382-6757
      email: valentin.klotzbuecher@usb.ch
      affiliation: "University of Basel & University Hospital Basel"
    - name: "David Reinstein"
      affiliation: "The Unjournal"
      # email: davidreinstein@unjournal.org
      orcid: 0000-0002-0470-4991
    - name: "Lorenzo Pacchiardi"
      orcid: 0000-0003-4760-7638
      # email: lo
      affiliation: "University of Cambridge, Leverhulme Centre for the Future of Intelligence"
    - name: "Tianmai Michael Zhang"
      orcid: 0000-0001-5108-9250
      email: tianmai@uw.edu
      affiliation: "University of Washington"
    # - name: "Casey Wimsatt"
    # - name: "Lorenzo Pacchiardi"
  chapters:
    - index.qmd
    - methods.qmd #Puts papers data together, calls the LLM runs, has python code
    - results_ratings.qmd #Matches LLM output to Unjournal rating data, analysis of differences and performance, R code
    - results_critiques.qmd #Compares GPT key issues vs human expert critiques from Coda
    # - questions_answers.qmd
    # - discussion.qmd
    - references.qmd
  appendices:
    - appendix_llm_traces.qmd
    # - paper_response_analysis.qmd
    - proposal.qmd  # Grant proposal (at very end)
  date: last-modified
  abstract: |
    We benchmark how frontier LLMs critique, rate, and prioritize research, comparing AI-generated evaluations to human expert assessments from The Unjournal. Human ratings serve as a reference signal—the core goal is measuring and diagnosing AI reasoning quality: understanding calibration, failure modes, and systematic "taste" differences between AI and human evaluators.
  repo-url: https://github.com/valentinklotzbuecher/llm-uj-research-eval
  downloads: [pdf]
  sidebar:
    style: "docked"
    search: true
    tools:
      - icon: file-earmark-text
        href: https://valentinklotzbuecher.github.io/llm-uj-research-eval/
        text: "Working Paper"
      - icon: rocket
        href: https://www.unjournal.org/
        text: "The Unjournal"
      # - icon: display
      #   href: slidesvk.html
      #   text: "📊 Slides"

bibliography:
  - "references.bib"
  - "grateful-refs.bib"
csl: "the-quarterly-journal-of-economics.csl"
link-citations: true


format:
  html:
    theme: [journal, theme-light.scss]
    # hypothesis: true  # Disabled - conflicts with embed-resources: true
    mainfont: Inter
    googlefonts:
      - Inter:400,400i,500,600,700
    highlight-style: atom-one
    toc: true
    number-sections: false
    citations-hover: true
    footnotes-hover: true
    embed-resources: true
    smooth-scroll: true
    code-fold: true
    code-tools: true
    code-summary: "Show code"
    code-overflow: wrap
    fig-cap-location: bottom
    fig-align: left
    lightbox: true
    df-print: paged
    execute:
      warning: false
      message: false
      freeze: false
      cache: false
      python: "python3"

