project:
  type: book
  output-dir: _book

python:
  executable: .venv/bin/python

book:
  title: "How Well Do Frontier LLMs Evaluate Research? Evidence from Structured Expert Peer Review"
  author:
    - name: "Valentin Klotzbücher"
      orcid: 0000-0001-9382-6757
      email: valentin.klotzbuecher@usb.ch
      affiliation: "University of Basel & University Hospital Basel"
    - name: "David Reinstein"
      affiliation: "The Unjournal"
      # email: davidreinstein@unjournal.org
      orcid: 0000-0002-0470-4991
    - name: "Lorenzo Pacchiardi"
      orcid: 0000-0003-4760-7638
      # email: lo
      affiliation: "University of Cambridge, Leverhulme Centre for the Future of Intelligence"
    - name: "Tianmai Michael Zhang"
      orcid: 0000-0001-5108-9250
      email: tianmai@uw.edu
      affiliation: "University of Washington"
  chapters:
    - index.qmd
    - results.qmd
    - discussion.qmd
    - methods.qmd
    - references.qmd
  appendices:
    - results_ratings.qmd
    - results_critiques.qmd
    - appendix_llm_traces.qmd
  date: last-modified
  abstract: |
    We evaluate how well frontier large language models (LLMs) can critique, rate, and prioritise research when constrained to the same structured rubric used in paid expert peer review. Using published evaluation packages from The Unjournal, we compare LLM-generated quantitative ratings (percentile scores with 90% credible intervals across seven criteria) and qualitative critiques to expert assessments for economics and social-science working papers. Human evaluations serve as a high-quality but noisy reference signal, allowing us to assess agreement while accounting for substantial inter-rater variability. Across models, we find moderate agreement with expert mean ratings, with the strongest-performing reasoning models approaching---though not reaching---the ceiling implied by human--human agreement. A consistent pattern is central compression: LLMs shrink extreme ratings toward the middle and often report narrower uncertainty than experts. On qualitative critique alignment, LLMs sometimes capture much of the expert-identified concern set but performance varies widely by paper, with frequent omissions of key issues and occasional emphasis on concerns not prioritised in expert syntheses. Cost differences across models are large, suggesting a practical tiered use: inexpensive models for rapid screening and stronger reasoners for deeper assessment, while retaining human oversight for high-stakes decisions. Overall, frontier LLMs can provide fast, structured evaluative signals, but systematic calibration and coverage gaps argue against fully automated peer review.
  repo-url: https://github.com/valentinklotzbuecher/llm-uj-research-eval
  downloads: [pdf]
  sidebar:
    style: "docked"
    search: true
    tools:
      - icon: rocket
        href: https://www.unjournal.org/
        text: "The Unjournal"
      # - icon: display
      #   href: slidesvk.html
      #   text: "📊 Slides"

bibliography:
  - "references.bib"
csl: "the-quarterly-journal-of-economics.csl"
link-citations: true


format:
  html:
    theme:
      dark: [darkly, theme-dark.scss]
      light: [journal, theme-light.scss]
    mainfont: Inter
    googlefonts:
      - Inter:400,400i,500,600,700
    highlight-style: atom-one
    toc: true
    number-sections: false
    citations-hover: true
    footnotes-hover: true
    smooth-scroll: true
    code-fold: true
    code-tools: true
    code-summary: "Show code"
    code-overflow: wrap
    fig-cap-location: bottom
    fig-align: left
    df-print: paged
    execute:
      warning: false
      message: false
      freeze: false
      cache: false
      python: "python3"
  pdf:
    documentclass: article
    top-level-division: section
    fontsize: 11pt
    geometry:
      - margin=1in
      - headheight=14pt
    toc: false
    number-sections: false
    include-in-header: preamble.tex
    latex-max-runs: 5
    link-citations: true
    keep-tex: true
    fig-cap-location: top
    fig-align: left
    df-print: kable
    pdf-engine: xelatex
    execute:
      warning: false
      message: false
      freeze: auto
      cache: true
      prefer-html: true
      echo: false
