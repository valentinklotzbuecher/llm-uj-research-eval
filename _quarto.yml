project:
  type: book
  output-dir: _book

python:
  executable: .venv/bin/python

book:
  title: "Just Ask the Model: One-Shot LLM Research Evaluation and Structured Expert Review"
  author:
    - name: "Valentin Klotzbücher"
      orcid: 0000-0001-9382-6757
      email: valentin.klotzbuecher@usb.ch
      affiliation: "University of Basel & University Hospital Basel"
    - name: "David Reinstein"
      affiliation: "The Unjournal"
      # email: davidreinstein@unjournal.org
      orcid: 0000-0002-0470-4991
    - name: "Lorenzo Pacchiardi"
      orcid: 0000-0003-4760-7638
      # email: lo
      affiliation: "University of Cambridge, Leverhulme Centre for the Future of Intelligence"
    - name: "Tianmai Michael Zhang"
      orcid: 0000-0001-5108-9250
      email: tianmai@uw.edu
      affiliation: "University of Washington"
  chapters:
    - index.qmd
    - results.qmd
    - discussion.qmd
    - methods.qmd
    - headless_codex_pilot.qmd
    - references.qmd
  appendices:
    - results_ratings.qmd
    - results_critiques.qmd
    - appendix_llm_traces.qmd
    - paper_response_analysis.qmd
  date: last-modified
  abstract: |
    Peer review is strained, and AI tools generating referee-like feedback are already adopted by researchers and commercial services—yet field evidence on how reliably frontier LLMs can evaluate research remains scarce. We compare structured one-shot evaluations by GPT-5 Pro against paid expert review packages from The Unjournal, an open evaluation platform covering economics and social-science working papers, where both humans and the model rate papers on seven percentile criteria with uncertainty intervals and provide narrative critiques. Treating human evaluations as a high-quality but noisy reference signal, we find that GPT-5 Pro approaches the agreement levels observed among human evaluators themselves on several criteria, while exhibiting consistent failure modes: compressed rating scales, uneven criterion coverage, and variable identification of expert-flagged concerns. Our results suggest that even a minimal one-shot setup—a single prompt with a fixed rubric, no iteration or retrieval augmentation—yields LLM ratings comparable to an additional expert rater, though central compression and uneven qualitative coverage indicate clear limitations. Appendix results for five additional models confirm the pattern across capability tiers.
  repo-url: https://github.com/valentinklotzbuecher/llm-uj-research-eval
  downloads: [pdf]
  sidebar:
    style: "docked"
    search: true
    tools:
      - icon: rocket
        href: https://www.unjournal.org/
        text: "The Unjournal"
      # - icon: display
      #   href: slidesvk.html
      #   text: "📊 Slides"

bibliography:
  - "references.bib"
csl: "the-quarterly-journal-of-economics.csl"
link-citations: true


format:
  html:
    comments:
      hypothesis: true
    theme:
      light: [journal, theme-light.scss]
      dark: [slate, theme-dark.scss]
    mainfont: "Source Serif 4"
    googlefonts:
      - Inter:wght@400;500;600;700
      - "Source Serif 4:ital,opsz,wght@0,8..60,300..900;1,8..60,300..900"
    highlight-style: atom-one
    toc: true
    number-sections: false
    citations-hover: true
    footnotes-hover: true
    smooth-scroll: true
    code-fold: true
    code-tools: true
    code-summary: "Show code"
    code-overflow: wrap
    fig-cap-location: bottom
    fig-align: left
    df-print: paged
    execute:
      warning: false
      message: false
      freeze: auto
      cache: false
      python: "python3"
  pdf:
    documentclass: article
    top-level-division: section
    fontsize: 11pt
    colorlinks: true
    geometry:
      - margin=1in
      - headheight=14pt
    toc: false
    number-sections: false
    include-in-header: preamble.tex
    latex-max-runs: 5
    link-citations: true
    keep-tex: true
    fig-cap-location: top
    fig-align: left
    df-print: kable
    pdf-engine: xelatex
    execute:
      warning: false
      message: false
      freeze: auto
      # knitr cache keys on chunk code only: data-file changes (e.g. results/
      # JSONs) do not invalidate it and silently produce stale numbers in the
      # PDF while HTML (cache: false) stays correct.
      cache: false
      prefer-html: true
      echo: false
