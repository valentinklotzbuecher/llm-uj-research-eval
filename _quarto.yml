project:
  type: book
  output-dir: _book

python:
  executable: .venv/bin/python

book:
  title: "Frontier LLMs as Research Evaluators: Evidence from The Unjournal's Expert Review Packages"
  author:
    - name: "Valentin Klotzbücher"
      orcid: 0000-0001-9382-6757
      email: valentin.klotzbuecher@usb.ch
      affiliation: "University of Basel & University Hospital Basel"
    - name: "David Reinstein"
      affiliation: "The Unjournal"
      # email: davidreinstein@unjournal.org
      orcid: 0000-0002-0470-4991
    - name: "Lorenzo Pacchiardi"
      orcid: 0000-0003-4760-7638
      # email: lo
      affiliation: "University of Cambridge, Leverhulme Centre for the Future of Intelligence"
    - name: "Tianmai Michael Zhang"
      orcid: 0000-0001-5108-9250
      email: tianmai@uw.edu
      affiliation: "University of Washington"
  chapters:
    - index.qmd
    - results.qmd
    - discussion.qmd
    - methods.qmd
    - references.qmd
  appendices:
    - results_ratings.qmd
    - results_critiques.qmd
    - appendix_llm_traces.qmd
  date: last-modified
  abstract: |
    Peer review is strained, and AI tools that generate "referee-like" feedback are already being adopted by researchers and commercial services. Yet we lack field evidence on how reliably frontier large language models (LLMs) can evaluate research, relative to expert judgment and under realistic rater disagreement. We compare structured evaluations produced by six frontier LLMs to paid expert review packages from an open evaluation platform (The Unjournal) covering economics and social-science working papers. Both humans and models score papers on seven rubric criteria using percentile ratings with uncertainty intervals, and provide narrative critiques. Treating human evaluations as a high-quality but noisy reference signal, we quantify human–LLM agreement (score- and rank-based), systematic biases (leniency/harshness and "central compression"), and criterion-level divergences. We also assess how often LLMs identify the key substantive concerns highlighted by expert reviewers. We find that top reasoning-capable models often approach the ceiling implied by human inter-rater variability on several criteria, while exhibiting consistent failure modes: compressed use of the rating scale, uneven performance across criteria, and variable coverage of expert-identified concerns. Given large cost advantages over human review, our results support AI use as structured screening and decision support rather than full automation, and motivate multi-run stability checks and stronger safeguards for confidentiality and adversarial manipulation.
  repo-url: https://github.com/valentinklotzbuecher/llm-uj-research-eval
  downloads: [pdf]
  sidebar:
    style: "docked"
    search: true
    tools:
      - icon: rocket
        href: https://www.unjournal.org/
        text: "The Unjournal"
      # - icon: display
      #   href: slidesvk.html
      #   text: "📊 Slides"

bibliography:
  - "references.bib"
csl: "the-quarterly-journal-of-economics.csl"
link-citations: true


format:
  html:
    theme:
      dark: [darkly, theme-dark.scss]
      light: [journal, theme-light.scss]
    mainfont: Inter
    googlefonts:
      - Inter:400,400i,500,600,700
    highlight-style: atom-one
    toc: true
    number-sections: false
    citations-hover: true
    footnotes-hover: true
    smooth-scroll: true
    code-fold: true
    code-tools: true
    code-summary: "Show code"
    code-overflow: wrap
    fig-cap-location: bottom
    fig-align: left
    df-print: paged
    execute:
      warning: false
      message: false
      freeze: false
      cache: false
      python: "python3"
  pdf:
    documentclass: article
    top-level-division: section
    fontsize: 11pt
    geometry:
      - margin=1in
      - headheight=14pt
    toc: false
    number-sections: false
    include-in-header: preamble.tex
    latex-max-runs: 5
    link-citations: true
    keep-tex: true
    fig-cap-location: top
    fig-align: left
    df-print: kable
    pdf-engine: xelatex
    execute:
      warning: false
      message: false
      freeze: auto
      cache: true
      prefer-html: true
      echo: false
