project:
  type: book

book:
  title: "Comparing LLM and human reviews of social science research using data from Unjournal.org"
  author:
    - name: "David Reinstein"
      affiliation: "The Unjournal"
      email: davidreinstein@unjournal.org
      orcid: 0000-0002-0470-4991
    # - name: "Alexander Herwix"
    - name: "Valentin Klotzbücher"
      orcid: 0000-0001-9382-6757
      email: valentin.klotzbuecher@posteo.de
      # affiliation: "University of Basel"
    # - name: "Casey Wimsatt"
    # - name: "Lorenzo Pacchiardi"
  chapters:
    - index.qmd
    # - numerical_ratings.qmd
    # - compare_ratings.qmd
    - methods.qmd
    - results.qmd
    - questions_answers.qmd
    - discussion.qmd
    # - journal_rankings.qmd
    # - claim_identification.qmd
    # - llm_evals.qmd
    # - human_evals.qmd
    # - compare_evals.qmd
    - references.qmd
  date: last-modified
  abstract: |
    We will build and refine LLM tools to generate peer-reviews and ratings of impactful research, and compare these with human experts' work (esp. from Unjournal.org): to benchmark performance, understand AI's research taste, and develop tools to improve research evaluation and dissemination.

bibliography:
  - "references.bib"
  - "grateful-refs.bib"
csl: "the-quarterly-journal-of-economics.csl"
link-citations: true


format:
  html:
    execute:
      python: "python3"
  html:
    theme: [journal, theme-light.scss]
    # googlefonts:
    #   - Source Sans Pro:400,600
    highlight-style: atom-one
    toc: true
    number-sections: false
    citations-hover: true
    footnotes-hover: true
    embed-resources: true
    smooth-scroll: true
    code-fold: true
    code-tools: true
    code-summary: "Show code"
    code-overflow: wrap
    fig-cap-location: bottom
    fig-align: left
    lightbox: true
    df-print: paged
    execute:
      warning: false
      message: false
      freeze: auto
      cache: true
    format-links: true
    code-links:
      - text: Project files
        icon: github
        href: https://github.com/valentinklotzbuecher/llm-uj-research-eval
    other-links:
      - text: The Unjournal
        icon: rocket
        href: https://www.unjournal.org/
      - text: Shared notes space (internal)
        icon: briefcase
        href: https://coda.io/d/Comparing-LLM-Generated-Reviews-to-Human-Evaluations-in-Social-S_dSJIQH2CJD3/Comparing-LLM-Generated-Reviews-to-Human-Evaluations-in-Social-S_su-eMZ5o#_luLzMjRe
