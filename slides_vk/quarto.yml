project:
  type: website        # or "default"
  output-dir: _site

format:
  revealjs:
    slide-separator: "---"
    vertical-separator: "----"
    incremental: false
    scrollable: false
    theme: custom.scss
    logo: "unjournal_logo.JPG"
    width: 1920
    height: 1080
    margin: 0.1
    menu:
      side: right
      width: wide
    center: true
    numbers: true
    slide-number: true
    show-slide-number: all
    embed-resources: true
    self-contained: true
