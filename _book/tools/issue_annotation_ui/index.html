<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Issue Match Annotator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div>
        <h1>Issue Match Annotator</h1>
        <p class="subtitle">Compare human critiques with LLM issues, add match notes, and export labels.</p>
      </div>
      <div class="controls">
        <label>
          Annotator
          <input id="annotatorName" type="text" placeholder="Your name" />
        </label>
        <label>
          Paper
          <select id="paperSelect"></select>
        </label>
        <div class="control-buttons">
          <button id="addIssue" type="button">Add Human Issue</button>
          <button id="downloadJson" type="button">Download JSON</button>
          <button id="downloadCsv" type="button">Download CSV</button>
          <button id="clearPaper" type="button" class="muted">Clear Paper</button>
        </div>
        <div id="saveStatus" class="save-status">Not saved</div>
      </div>
    </header>

    <main class="grid">
      <section class="panel">
        <h2>Human Critiques</h2>
        <div class="panel-links">
          <a id="unjournalLink" href="#" target="_blank" rel="noreferrer">Open evaluation summary</a>
        </div>
        <div class="issue-selector">
          <label>
            Human issue
            <select id="humanIssueSelect"></select>
          </label>
          <div class="issue-nav">
            <button id="prevIssue" type="button" class="muted">Prev</button>
            <button id="nextIssue" type="button" class="muted">Next</button>
          </div>
        </div>
        <div id="selectedIssueText" class="long-text selected-issue"></div>
        <details>
          <summary>All critiques (formatted)</summary>
          <div id="formattedCritique" class="formatted-critique"></div>
        </details>
      </section>

      <section class="panel">
        <h2>LLM Key Issues</h2>
        <ol id="llmIssues" class="llm-issues"></ol>
        <details>
          <summary>LLM full report</summary>
          <div id="llmReport" class="long-text report-text"></div>
        </details>
      </section>
    </main>

    <section class="panel full-width">
      <h2>Match to LLM Issues</h2>
      <div id="humanIssues" class="issues"></div>
    </section>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
